[mod-name]
starter-infinity-chest=初始永续箱

[mod-description]
starter-infinity-chest=自由模式开局时，每位新玩家都会获得一个只能使用一次的永续箱。放置并打开后可领取所需的初始物资；关闭界面时，箱子会永久消失。

